name: Auto-merge Claude branches

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  create-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase on master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git rebase origin/master || {
            echo "::error::Rebase failed — manual intervention needed"
            git rebase --abort
            exit 1
          }
          git push --force-with-lease

      - name: Create PR and merge
        run: |
          PR_URL=$(gh pr create --base master --head "$GITHUB_REF_NAME" \
            --title "Auto-merge: $GITHUB_REF_NAME" \
            --body "Auto-created from push to $GITHUB_REF_NAME" 2>&1) || true

          if echo "$PR_URL" | grep -q "already exists"; then
            PR_URL=$(gh pr list --head "$GITHUB_REF_NAME" --json url --jq '.[0].url')
          fi

          sleep 5
          gh pr merge "$GITHUB_REF_NAME" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
