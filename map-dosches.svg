<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .road{fill:none;stroke:#3a3a3a;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .road-minor{fill:none;stroke:#2a2a2a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .field{fill:#2d4a1e;opacity:.5}
      .village{fill:#1a1a1a;opacity:.3}
      .building{fill:#4a3a2a;stroke:#5a4a3a;stroke-width:1}
      .water{fill:#1a3a5a;opacity:.6}
      .label{font-family:sans-serif;font-size:11px;fill:#c9a84c;font-weight:bold;text-anchor:middle}
      .label-sub{font-family:sans-serif;font-size:9px;fill:#999;text-anchor:middle}
      .pin{fill:#c9a84c;stroke:#fff;stroke-width:1.5}
      .pin-home{fill:#e74c3c;stroke:#fff;stroke-width:2}
      .road-label{font-family:sans-serif;font-size:8px;fill:#555;font-style:italic;text-anchor:middle}
      .compass{fill:none;stroke:#c9a84c;stroke-width:1.5}
      .compass-n{font-family:serif;font-size:14px;fill:#c9a84c;text-anchor:middle;font-weight:bold}
      .title{font-family:serif;font-size:18px;fill:#c9a84c;text-anchor:middle;letter-spacing:2px}
      .border{fill:none;stroke:#c9a84c;stroke-width:2;opacity:.3}
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0f1a0a"/>

  <!-- Border -->
  <rect x="10" y="10" width="780" height="580" class="border" rx="8"/>

  <!-- Fields -->
  <rect x="0" y="0" width="250" height="200" class="field" rx="20"/>
  <rect x="550" y="0" width="250" height="180" class="field" rx="15"/>
  <rect x="0" y="400" width="200" height="200" class="field" rx="20"/>
  <rect x="600" y="420" width="200" height="180" class="field" rx="15"/>
  <rect x="300" y="0" width="180" height="120" class="field" rx="10"/>

  <!-- Village area -->
  <ellipse cx="400" cy="320" rx="200" ry="150" class="village"/>

  <!-- Roads -->
  <!-- D8 (vertical main road) -->
  <path d="M 350 0 Q 360 150 340 250 Q 320 350 280 500 Q 260 550 250 600" class="road"/>
  <!-- D48 (branches east) -->
  <path d="M 420 0 Q 430 80 450 150 Q 480 250 520 320 Q 580 420 650 500 Q 700 550 750 600" class="road"/>
  <!-- Rue de la Font des Champs -->
  <path d="M 520 320 Q 580 350 650 380 Q 720 410 800 430" class="road-minor"/>
  <!-- Rue du Grand Cernay -->
  <path d="M 280 420 Q 200 460 120 490 Q 60 510 0 530" class="road-minor"/>
  <!-- Village internal roads -->
  <path d="M 340 250 Q 380 280 420 300 Q 460 310 520 320" class="road-minor"/>
  <path d="M 320 300 Q 350 340 380 380 Q 400 420 420 460" class="road-minor"/>
  <path d="M 250 300 Q 290 310 320 300" class="road-minor"/>

  <!-- Road labels -->
  <text x="365" y="50" class="road-label" transform="rotate(-5,365,50)">D8</text>
  <text x="455" y="50" class="road-label" transform="rotate(8,455,50)">D48</text>
  <text x="680" y="405" class="road-label" transform="rotate(12,680,405)">Rue de la Font des Champs</text>
  <text x="130" y="480" class="road-label" transform="rotate(-15,130,480)">Rue du Grand Cernay</text>

  <!-- Buildings (scattered) -->
  <rect x="355" y="270" width="15" height="12" class="building" transform="rotate(10,362,276)"/>
  <rect x="390" y="290" width="12" height="10" class="building" transform="rotate(-5,396,295)"/>
  <rect x="420" y="310" width="18" height="12" class="building" transform="rotate(15,429,316)"/>
  <rect x="370" y="330" width="14" height="11" class="building"/>
  <rect x="340" y="310" width="11" height="14" class="building" transform="rotate(-8,345,317)"/>
  <rect x="450" y="280" width="13" height="10" class="building" transform="rotate(5,456,285)"/>
  <rect x="480" y="300" width="16" height="11" class="building"/>
  <rect x="410" y="350" width="12" height="15" class="building" transform="rotate(12,416,357)"/>
  <rect x="350" y="360" width="10" height="13" class="building"/>
  <rect x="310" y="340" width="14" height="10" class="building" transform="rotate(-10,317,345)"/>
  <rect x="460" y="340" width="11" height="12" class="building"/>
  <rect x="500" y="290" width="12" height="10" class="building" transform="rotate(8,506,295)"/>
  <rect x="300" y="270" width="13" height="11" class="building"/>

  <!-- Dosches label -->
  <text x="400" y="415" class="title">DOSCHES</text>

  <!-- CHECKPOINT PINS -->

  <!-- Moulin de Dosches (top, near D8/D48 junction) -->
  <circle cx="380" cy="130" r="8" class="pin"/>
  <circle cx="380" cy="130" r="3" fill="#0f1a0a"/>
  <text x="380" y="115" class="label">Le Moulin</text>
  <text x="380" y="158" class="label-sub">🏔️ FRESQUE</text>

  <!-- Église (center-right of village) -->
  <circle cx="470" cy="270" r="8" class="pin"/>
  <circle cx="470" cy="270" r="3" fill="#0f1a0a"/>
  <text x="470" y="255" class="label">Église St-Jean</text>
  <text x="470" y="298" class="label-sub">⛪ JEAN</text>

  <!-- Salle Polyvalente (left of village) -->
  <circle cx="230" cy="310" r="8" class="pin"/>
  <circle cx="230" cy="310" r="3" fill="#0f1a0a"/>
  <text x="230" y="295" class="label">Salle Polyvalente</text>
  <text x="230" y="338" class="label-sub">🌹 ROSE</text>

  <!-- Mairie (center of village) -->
  <circle cx="370" cy="350" r="8" class="pin"/>
  <circle cx="370" cy="350" r="3" fill="#0f1a0a"/>
  <text x="335" y="370" class="label">Mairie</text>
  <text x="335" y="385" class="label-sub">📜 LOIS</text>

  <!-- Lavoir (south-east) -->
  <circle cx="530" cy="370" r="8" class="pin"/>
  <circle cx="530" cy="370" r="3" fill="#0f1a0a"/>
  <rect x="522" y="376" width="16" height="8" class="water" rx="2"/>
  <text x="530" y="358" class="label">Le Lavoir</text>
  <text x="530" y="400" class="label-sub">💧 ONDE</text>

  <!-- Ferme d'Octave (DÉPART / ARRIVÉE — bottom right, Rue Font des Champs) -->
  <circle cx="660" cy="450" r="10" class="pin-home"/>
  <circle cx="660" cy="450" r="4" fill="#fff"/>
  <text x="660" y="435" class="label" style="fill:#e74c3c;font-size:12px">🏠 Ferme d'Octave</text>
  <text x="660" y="475" class="label-sub" style="fill:#e74c3c">DÉPART / ARRIVÉE</text>

  <!-- Compass -->
  <g transform="translate(720,60)">
    <line x1="0" y1="20" x2="0" y2="-20" class="compass"/>
    <line x1="-15" y1="0" x2="15" y2="0" class="compass"/>
    <polygon points="0,-22 -5,-10 5,-10" fill="#c9a84c"/>
    <text x="0" y="-28" class="compass-n">N</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(50,560)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#c9a84c" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#c9a84c" stroke-width="1.5"/>
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#c9a84c" stroke-width="1.5"/>
    <text x="40" y="-6" class="road-label" style="fill:#c9a84c">~200m</text>
  </g>
</svg>